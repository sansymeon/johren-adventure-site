<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Create · Turbo Adventures</title>
  <link rel="stylesheet" href="/create/engine/studio.css">
  <link rel="stylesheet" href="/create/engine/play.css">
</head>
<body class="play-page" data-scene-format="landscape">
  <div id="play-welcome" class="play-welcome" hidden></div>
  <div id="play-choose" class="play-choose" hidden>
    <header class="play-top">
      <p class="play-kicker">Turbo Adventures</p>
      <h1>Choose Assets</h1>
      <p class="play-format-note">Collected pictures only</p>
    </header>
    <div class="play-grid" id="play-grid"></div>
    <footer class="play-foot">
      <p class="play-bg-note" id="play-bg-note">Background</p>
      <button type="button" class="play-go" id="play-arrange-btn">Arrange My Scene</button>
    </footer>
  </div>
  <div id="play-arrange" class="play-arrange" hidden>
    <div class="stage-column">
      <div class="stage-fit">
        <div class="stage" id="stage" data-format="landscape">
          <p class="stage-hint"></p>
          <div class="layers"></div>
        </div>
      </div>
    </div>
    <aside class="play-side">
      <p class="play-format-note">16:9</p>
      <div class="play-tools" id="play-tools" hidden>
        <p class="play-selected" id="play-selected-name"></p>
        <div class="play-tool-row">
          <button type="button" class="play-tool" data-action="flip">Flip</button>
          <button type="button" class="play-tool" data-action="resize-up">Larger</button>
          <button type="button" class="play-tool" data-action="resize-down">Smaller</button>
          <button type="button" class="play-tool" data-action="shadow">Shadow</button>
          <button type="button" class="play-tool" data-action="send-backward">Back</button>
          <button type="button" class="play-tool" data-action="bring-forward">Forward</button>
          <button type="button" class="play-tool" data-action="remove-layer">Remove</button>
        </div>
      </div>
      <div class="play-bg-tools" id="play-bg-tools" hidden>
        <div class="play-tool-row">
          <button type="button" class="play-tool" data-action="bg-zoom-out">Zoom −</button>
          <button type="button" class="play-tool" data-action="bg-zoom-in">Zoom +</button>
          <button type="button" class="play-tool" data-action="bg-reset">Reset</button>
        </div>
      </div>
      <div class="play-bar">
        <button type="button" class="play-bar-btn" id="play-add-btn">Choose Assets</button>
        <button type="button" class="play-bar-btn" id="play-format-land">Landscape</button>
        <button type="button" class="play-bar-btn" id="play-format-port">Portrait</button>
        <button type="button" class="play-bar-btn play-bar-primary" data-action="export-jpeg">Save JPG</button>
        <button type="button" class="play-bar-btn" data-action="export-png">Save PNG</button>
      </div>
    </aside>
  </div>
  <div id="play-preview" class="play-preview" hidden>
    <div class="play-preview-card">
      <button type="button" class="play-preview-close" data-action="close-preview">Close</button>
      <div class="play-preview-figure"><img id="play-preview-img" alt=""></div>
      <p id="play-preview-name" class="play-preview-name"></p>
      <button type="button" class="play-go" id="play-preview-add" data-action="preview-use">Add to Scene</button>
    </div>
  </div>
  <p id="play-status" class="play-status" role="status" hidden></p>
  <button type="button" id="play-welcome-start" hidden></button>
  <script src="/create/engine/catalogue-data.js"></script>
  <script src="/create/engine/cutout.js"></script>
  <script src="/create/engine/editor.js"></script>
  <script src="/create/engine/play.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
