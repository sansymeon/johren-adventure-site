<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>つくる · ターボ・アドベンチャーズ</title>
  <link rel="stylesheet" href="/create/engine/studio.css">
  <link rel="stylesheet" href="/create/engine/play.css">
</head>
<body class="play-page" data-scene-format="landscape">
  <div id="play-gate" class="play-gate">
    <div class="play-gate-card">
      <p class="play-kicker">ターボ・アドベンチャーズ</p>
      <h1>つくる</h1>
      <a class="play-go" href="?mode=demo">おためし体験</a>
      <a class="play-go play-go-second" href="?mode=collection">マイコレクション</a>
      <a class="play-more" href="/map/?map=turbo">もっと絵を集めよう！</a>
    </div>
  </div>
  <div id="play-welcome" class="play-welcome" hidden></div>
  <div id="play-choose" class="play-choose" hidden>
    <header class="play-top">
      <p class="play-kicker">ターボ・アドベンチャーズ</p>
      <h1>絵を選ぶ</h1>
      <p class="play-format-note">集めた絵だけ使えます</p>
    </header>
    <div class="play-grid" id="play-grid"></div>
    <footer class="play-foot">
      <p class="play-bg-note" id="play-bg-note">背景</p>
      <button type="button" class="play-go" id="play-arrange-btn">シーンを並べる</button>
      <a class="play-more" href="/map/?map=turbo">もっと絵を集めよう！</a>
    </footer>
  </div>
  <div id="play-arrange" class="play-arrange" hidden>
    <div class="stage-column">
      <div class="stage-fit">
        <div class="stage" id="stage" data-format="landscape">
          <p class="stage-hint"></p>
          <div class="layers"></div>
        </div>
      </div>
    </div>
    <aside class="play-side">
      <p class="play-format-note">16:9</p>
      <div class="play-tools" id="play-tools" hidden>
        <p class="play-selected" id="play-selected-name"></p>
        <div class="play-tool-row">
          <button type="button" class="play-tool" data-action="flip">反転</button>
          <button type="button" class="play-tool" data-action="resize-up">大きく</button>
          <button type="button" class="play-tool" data-action="resize-down">小さく</button>
          <button type="button" class="play-tool" data-action="shadow">影</button>
          <button type="button" class="play-tool" data-action="send-backward">後ろへ</button>
          <button type="button" class="play-tool" data-action="bring-forward">前へ</button>
          <button type="button" class="play-tool" data-action="remove-layer">外す</button>
        </div>
      </div>
      <div class="play-bg-tools" id="play-bg-tools" hidden>
        <div class="play-tool-row">
          <button type="button" class="play-tool" data-action="bg-zoom-out">縮小</button>
          <button type="button" class="play-tool" data-action="bg-zoom-in">拡大</button>
          <button type="button" class="play-tool" data-action="bg-reset">戻す</button>
        </div>
      </div>
      <div class="play-bar">
        <button type="button" class="play-bar-btn" id="play-add-btn">絵を選ぶ</button>
        <button type="button" class="play-bar-btn" id="play-format-land">横</button>
        <button type="button" class="play-bar-btn" id="play-format-port">縦</button>
        <button type="button" class="play-bar-btn play-bar-primary" data-action="export-jpeg">画像を保存</button>
        <button type="button" class="play-bar-btn" data-action="share-jpeg">画像をシェア</button>
        <a class="play-more" href="/map/?map=turbo">もっと絵を集めよう！</a>
      </div>
    </aside>
  </div>
  <div id="play-preview" class="play-preview" hidden>
    <div class="play-preview-card">
      <button type="button" class="play-preview-close" data-action="close-preview">閉じる</button>
      <div class="play-preview-figure"><img id="play-preview-img" alt=""></div>
      <p id="play-preview-name" class="play-preview-name"></p>
      <button type="button" class="play-go" id="play-preview-add" data-action="preview-use">加える</button>
    </div>
  </div>
  <p id="play-status" class="play-status" role="status" hidden></p>
  <button type="button" id="play-welcome-start" hidden></button>
  <script src="/map/js/image-share.js"></script>
  <script src="/create/engine/catalogue-data.js"></script>
  <script src="/create/engine/cutout.js"></script>
  <script src="/create/engine/editor.js"></script>
  <script src="/create/engine/play.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
