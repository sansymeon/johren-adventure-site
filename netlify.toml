# Public Turbo Adventures site only.
# This file is local preparation. It has not been published.
# The live johrenadventure.com deploy still uses the older site until an approved production publish.

[build]
  publish = "site"
  command = "echo static"

[build.environment]
  NODE_VERSION = "18"

# Printed postcard QR codes are /q/TA-######. The page looks up site/data/qr/destinations.json.
[[redirects]]
  from = "/q/*"
  to = "/q/index.html"
  status = 200

[[headers]]
  for = "/data/qr/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/q/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/**/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
